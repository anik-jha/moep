[project]
name = "moep"
version = "0.1.0"
description = "Domain-focused MoE expert pruning: profile, score, prune, heal, eval, export"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.9",
    "transformers>=4.57",
    "accelerate>=1.6",
    "safetensors>=0.5",
    "huggingface_hub>=0.34",
    "datasets>=3.5",
    "numpy>=2.0",
    "tqdm>=4.66",
    "compressed-tensors>=0.15.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
heal = ["peft>=0.15", "trl>=0.17"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[project.scripts]
moep = "moep.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moep"]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
